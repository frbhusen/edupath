name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret
    steps:
      # The repo root is the `study_platform` package (relative imports),
      # so check it out into a folder with that name.
      - uses: actions/checkout@v4
        with:
          path: study_platform

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: study_platform/requirements*.txt

      - name: Install system libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - name: Install dependencies
        run: pip install -r study_platform/requirements.txt -r study_platform/requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s study_platform/tests -t . -v
